schema: sim2web-config/1
title: 'FLAC3D underground cavern: five construction stages'
description: Construction sequence for the underground cavern, showing the excavation
  boundary and common section planes.
solver: FLAC3D
input:
  stages:
  - file: input/I-1.vtu
    name: I-1
    label: I-1
  - file: input/I-3.vtu
    name: I-3
    label: I-3
  - file: input/II-2.vtu
    name: II-2
    label: II-2
  - file: input/III-3.vtu
    name: III-3
    label: III-3
  - file: input/IV-2.vtu
    name: IV-2
    label: IV-2
output:
  dir: site
fields:
  displacement:
    name: Displacement
    unit: m
  stress:
    name: Stress
    order: XX,YY,ZZ,XY,XZ,YZ
    unit: MPa
    sign_convention: 'FLAC3D convention: tension positive, compression negative'
  categories:
  - name: 'Group Slot : Default'
    label: Group (slot Default)
geometry:
  primary: excavation
  exterior:
    enabled: false
  excavation:
    enabled: true
    strategy: stress
    null_threshold: 1.0e-08
    contact_tolerance: 1.0e-05
    required: true
  display_averaging: whole_solid
sections:
