schema: sim2web-config/1
title: "Case H: MOOSE elastic patch"
solver: MOOSE Solid Mechanics
input:
  stages: [{file: moose.vtu, name: final_t2}]
output: {dir: site}
fields:
  displacement: {name: disp, unit: ''}
  stress: {name: stress, order: from_file, unit: '', unit_check: false}
geometry:
  primary: exterior
  exterior: {enabled: true, split_by_group: false, internal_faces: keep}
  excavation: {enabled: false}
sections: {axes: [x, y, z], spacing: 0.2, placement: interior, min_points: 0}
viewer: {default_field: TotalDisplacement, default_axis: x}
