name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4          # LFS models are not fetched; real-data tests skip
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: CLI smoke test on a synthetic model
        shell: bash
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "tests")
          from conftest import make_block_model
          make_block_model()[0].save("smoke.vtu")
          PY
          sim2web inspect smoke.vtu --draft-config smoke.yaml > /dev/null
          python - <<'PY'
          import yaml
          d = yaml.safe_load(open("smoke.yaml"))
          d["output"]["viewer"] = False
          d["fields"]["stress"]["order"] = "XX,YY,ZZ,XY,YZ,XZ"
          yaml.safe_dump(d, open("smoke.yaml", "w"))
          PY
          sim2web build smoke.yaml
          sim2web validate smoke.yaml

  viewer:
    name: Viewer and workbench build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run test:viewer
      - run: npm run test:workbench
      - run: npm run build:viewer
      - run: npm run build:workbench
      - uses: actions/upload-artifact@v4
        with:
          name: viewer_dist
          path: src/sim2web/viewer_dist
      - uses: actions/upload-artifact@v4
        with:
          name: workbench_dist
          path: src/sim2web/workbench_dist

  wheel:
    name: Wheel with bundled viewer
    needs: viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: viewer_dist
          path: src/sim2web/viewer_dist
      - uses: actions/download-artifact@v4
        with:
          name: workbench_dist
          path: src/sim2web/workbench_dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --wheel
      - run: python -m pip install dist/*.whl && python -c "from sim2web.site import viewer_available; from sim2web.workbench import WORKBENCH_DIR; assert viewer_available() and (WORKBENCH_DIR / 'index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
