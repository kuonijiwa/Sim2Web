[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosimvis"
version = "0.1.0a0"
description = "VTU-to-VTP post-processing and static Web visualization examples"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pyvista==0.46.3",
  "vtk==9.5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
